<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symétrie 3D Interactive</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }

        .card {
            width: 300px;
            height: 400px;
            perspective: 1000px;
            cursor: pointer;
        }

        .parent {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Rotation au clic (via :active) ou au survol */
        .card:active .parent, .card:hover .parent {
            transform: rotateY(180deg);
        }

        /* Style commun pour le Recto et le Verso */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            /* Les deux faces suivent la même animation */
            animation: bg-sync 12s infinite;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* --- FACE RECTO --- */
        .front {
            z-index: 2;
        }

        /* --- FACE VERSO (La Symétrie) --- */
        .back {
            transform: rotateY(180deg) scaleX(-1); 
            /* rotateY(180deg) : tourne la face pour le dos */
            /* scaleX(-1) : crée l'effet miroir (symétrie horizontale) */
        }

        /* L'animation unique pour les deux faces */
        @keyframes bg-sync {
            0%, 30% { background-image: url('./image/avatar-3.jpg'); }
            33%, 63% { background-image: url('./image/avatar-4.jpg'); }
            66%, 100% { background-image: url('./image/avatar-5.jpg'); }
        }

        .content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            backface-visibility: hidden;
        }
    </style>
</head>
<body>

<!--
https://gemini.google.com/app/5580e85c073337f6?hl=fr
https://gemini.google.com/app/5580e85c073337f6?hl=fr
https://gemini.google.com/app/5580e85c073337f6?hl=fr
https://gemini.google.com/app/5580e85c073337f6?hl=fr
-->

    <div class="card">
        <div class="parent">
            <div class="face front">
                <div class="content">
                    <h3>Recto</h3>
                </div>
            </div>
            
            <div class="face back">
                <div class="content">
                    <h3>Verso (Miroir)</h3>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
