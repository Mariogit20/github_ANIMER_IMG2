<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation 3 Séquences</title>
    <style>
.parent {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
            border-radius: 20px;
            
            /* On force l'affichage ici */
            background-position: center !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;
            
            animation: bg 12s infinite;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Utilisation de paliers pour éviter le "vide" entre les images */
        @keyframes bg {
            0%, 30% {
                background-image: url('./image/avatar-3.jpg');                
            }
            33%, 63% {
                background-image: url('./image/avatar-4.jpg');                
            }
            66%, 100% {
                background-image: url('./image/avatar-5.jpg');
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="parent">
            <div class="content">
                <h3>Séquence Photo</h3>
                <p>L'image change à 40% et 100%</p>
            </div>
        </div>
    </div>

</body>
</html>
