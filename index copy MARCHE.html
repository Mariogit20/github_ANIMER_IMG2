<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation 3 Séquences - Corrigé</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }

        .card {
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }

        .parent {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
            border-radius: 20px;
            
            /* Propriétés de base du fond */
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            
            /* L'animation */
            animation: bg-loop 12s infinite;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Effet miroir corrigé : on cache le verso si vous ne voulez pas voir le texte à l'envers */
        .parent {
            backface-visibility: hidden;
        }

        .card:hover .parent {
            transform: rotateY(180deg);
        }

        /* Animation avec paliers pour forcer l'affichage des images locales */
        @keyframes bg-loop {
            0%, 30% {
                background-image: url('./image/avatar-3.jpg');
            }
            33%, 63% {
                background-image: url('./image/avatar-4.jpg');
            }
            66%, 100% {
                background-image: url('./image/avatar-5.jpg');
            }
        }

        .content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            /* Empêche le texte de disparaître lors de la rotation */
            backface-visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="parent">
            <div class="content">
                <h3>Séquence Photo</h3>
                <p>Images : avatar-3, 4 et 5</p>
            </div>
        </div>
    </div>

</body>
</html>
